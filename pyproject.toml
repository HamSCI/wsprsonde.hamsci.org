[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wsprsonde"
version = "0.1.0"
description = "Tracking, frequency coordination and monitoring for the HamSCI WSPRSonde network"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Nathaniel A. Frissell", email = "nathaniel.frissell@scranton.edu" }]

# No runtime dependencies. The WsprDaemon client speaks HTTP to a ClickHouse
# endpoint through urllib, and the station list is plain CSV, so the location
# product can be rebuilt on any machine with a stock Python. Keep it that way
# unless there is a strong reason not to -- this is the piece collaborators are
# most likely to want to run without setting up an environment first.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
wsprsonde-locations = "wsprsonde.build_locations:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
